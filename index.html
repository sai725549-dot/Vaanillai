<!DOCTYPE html><html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>வானிலை</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111111"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#fff;--ink2:rgba(255,255,255,.8);--glass:rgba(0,0,0,.34);--line:rgba(255,255,255,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#111;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Noto Sans Tamil","Latha","Nirmala UI",system-ui,sans-serif;font-weight:400;background:transparent}
.bg{position:fixed;inset:0;background-size:cover;background-position:center;z-index:-2}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:-1}
.wrap{max-width:440px;margin:0 auto;padding:18px 16px 28px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.place{font-size:17px;font-weight:500;margin:0;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.date{font-size:13px;color:var(--ink2);margin:2px 0 0;text-shadow:0 1px 6px rgba(0,0,0,.5)}
button{font:inherit;color:var(--ink);background:var(--glass);border:.5px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero{margin-top:24vh}
.badge{display:inline-block;font-size:13px;padding:4px 12px;border-radius:8px;background:var(--glass);border:.5px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.temp{font-size:84px;font-weight:400;line-height:1.1;margin:6px 0 0;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.cond{font-size:19px;margin:0;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hl{font-size:14px;color:var(--ink2);margin:4px 0 0;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.panel{margin-top:16px;background:var(--glass);border:.5px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tip{font-size:14px;line-height:1.7}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line);font-size:14px}
.row:last-child{border-bottom:0}
.d{width:68px}.bar{flex:1;height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff}
.p{width:36px;text-align:right;font-size:12px;color:var(--ink2)}.t{width:66px;text-align:right}.t span{color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips button[aria-pressed=true]{background:rgba(255,255,255,.9);color:#111}
.note{font-size:12px;color:var(--ink2);margin:12px 2px 0;text-shadow:0 1px 6px rgba(0,0,0,.5)}
</style></head><body>
<div class="bg" id="bg"></div><div class="scrim"></div>
<main class="wrap">
 <div class="top"><div><h1 class="place" id="place"></h1><p class="date" id="date"></p></div><button id="unit"></button></div>
 <section class="hero"><span class="badge" id="season"></span>
  <p class="temp" id="now"></p><p class="cond" id="cond"></p><p class="hl" id="hl"></p></section>
 <section class="panel tip" id="tip"></section>
 <section class="panel" id="list" aria-label="8 நாள் முன்னறிவிப்பு"></section>
 <div class="chips" id="chips" role="group" aria-label="காலம் தேர்வு"></div>
 <p class="note" id="note"></p>
</main>

function cv(f){return Math.round(useC?(f-32)*5/9:f);}
function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function pd(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2]);}
function auto(){var c=DATA.cond,t=(DATA.nowF-32)*5/9;
 if(c==="rain"||c==="drizzle")return"mazhai";
 if(c==="storm"||c==="cloudy")return"vasantham";
 if(c==="fog"||t<=21)return"kulir";
 return"veyil";}
function render(){
 var k=pick||auto(),now=new Date(),today=ymd(now);
 document.getElementById("bg").style.backgroundImage='url("'+IMG[k]+'")';
 document.getElementById("place").textContent=DATA.place;
 document.getElementById("date").textContent=WDL[now.getDay()]+", "+now.getDate()+" "+MO[now.getMonth()]+" "+now.getFullYear();
 document.getElementById("season").textContent=S[k].n;
 document.getElementById("tip").textContent=S[k].tip;
 document.getElementById("now").textContent=cv(DATA.nowF)+"°";
 document.getElementById("cond").textContent=CT[DATA.cond]||"";

 document.getElementById("hl").textContent="அதிகபட்சம் "+cv(ds[0][1])+"° · குறைந்தபட்சம் "+cv(ds[0][2])+"°";

var LAT=13.1007,LON=77.5963;
function wc(c){if(c>=95)return"storm";if(c>=51&&c<=82)return(c<=57)?"drizzle":"rain";if(c===45||c===48)return"fog";if(c===3||c>=71)return"cloudy";return"clear";}
function f(c){return c*9/5+32;}
function load(){
 fetch("https://api.open-meteo.com/v1/forecast?latitude="+LAT+"&longitude="+LON+"&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=8")
 .then(function(r){return r.json();}).then(function(j){
  DATA.nowF=f(j.current.temperature_2m);DATA.cond=wc(j.current.weather_code);DATA.asof=ymd(new Date());
  DATA.days=j.daily.time.map(function(t,i){return[t,f(j.daily.temperature_2m_max[i]),f(j.daily.temperature_2m_min[i]),j.daily.precipitation_probability_max[i]||0];});
  try{localStorage.setItem("wxData",JSON.stringify(DATA));}catch(e){}
  render();
 }).catch(function(){});
}
try{var c=JSON.parse(localStorage.getItem("wxData")||"null");if(c&&c.days)DATA=c;}catch(e){}
try{var L=JSON.parse(localStorage.getItem("wxLoc")||"null");if(L){LAT=L[0];LON=L[1];}}catch(e){}
function geo(){
 fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+LAT+"&longitude="+LON+"&localityLanguage=ta")
 .then(function(r){return r.json();}).then(function(j){
  var n=j.locality||j.city||"",c=(j.city&&j.city!==n)?j.city:(j.principalSubdivision||"");
  var pl=[n,c].filter(Boolean).join(", ");
  if(pl){DATA.place=pl;try{localStorage.setItem("wxData",JSON.stringify(DATA));}catch(e){}render();}
 }).catch(function(){});
}
function locate(cb){
 if(!navigator.geolocation){cb();return;}
 navigator.geolocation.getCurrentPosition(function(p){
  var la=p.coords.latitude,lo=p.coords.longitude;
  var moved=Math.abs(la-LAT)>0.05||Math.abs(lo-LON)>0.05;
  LAT=la;LON=lo;
  try{localStorage.setItem("wxLoc",JSON.stringify([la,lo]));}catch(e){}
  if(moved){DATA.place="உங்கள் இடம்";render();}
  if(moved||DATA.place==="உங்கள் இடம்")geo();
  cb();
 },function(){cb();},{timeout:8000,maximumAge:1800000});
}
render();locate(load);
setInterval(function(){locate(load);},1800000);
